<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Army Corrections Command</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1a0f;
  color:white;
}
.topbar{
  background:#111;
  padding:15px;
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid gold;
}
.logo{ color:gold; font-weight:bold; }
.nav button{
  margin-right:10px;
  background:none;
  border:1px solid gold;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}
.card{
  margin:20px;
  padding:20px;
  border:1px solid gold;
  background:#122417;
}
input{
  display:block;
  margin:10px 0;
  padding:8px;
  width:100%;
}
button.primary{
  background:gold;
  color:black;
  border:none;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">U.S. ARMY CORRECTIONS COMMAND</div>
  <div id="userBox">Not logged in</div>
</div>

<div class="nav">
  <button onclick="view('about')">About</button>
  <button onclick="view('org')">Organization</button>
  <button onclick="view('leadership')">Leadership</button>
  <button onclick="view('login')" id="loginBtn">Login</button>
  <button onclick="view('internal')" id="internalBtn" style="display:none">ACC Panel</button>
  <button onclick="view('high')" id="adminBtn" style="display:none">High Command</button>
</div>

<div id="content" class="card"></div>

<script>
const API="YOUR_WORKER_URL";

let token="";
let me=null;

function setUser(){
  document.getElementById("userBox").innerText =
    me ? `${me.rank} ${me.username} (${me.unit})` : "Not logged in";

  document.getElementById("loginBtn").style.display = me ? "none":"inline";
  document.getElementById("internalBtn").style.display = me ? "inline":"none";
  document.getElementById("adminBtn").style.display = (me && me.admin) ? "inline":"none";
}

async function api(path,method="GET",body=null){
  const res = await fetch(API+path,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization": token ? "Bearer "+token : ""
    },
    body: body ? JSON.stringify(body):null
  });
  return await res.json();
}

function view(v){

if(v==="about"){
content.innerHTML=`<h2>Who We Are</h2><p>Army Corrections Command...</p>`;
}

if(v==="org"){
content.innerHTML=`<h2>Organization</h2><p>Structure here...</p>`;
}

if(v==="leadership"){
content.innerHTML=`<h2>Leadership</h2><p>Editable bios here...</p>`;
}

if(v==="login"){
content.innerHTML=`
<h2>Login</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login</button>`;
}

if(v==="internal"){
content.innerHTML=`
<h2>ACC Internal Panel</h2>

${me.unit==="CID" ? `<button onclick="ban()">Ban Request</button>`:""}

<button onclick="io()">Inquiry Order</button>
`;
}

if(v==="high"){
content.innerHTML=`
<h2>High Command Panel</h2>
<button onclick="load('ban')">Ban Requests</button>
<button onclick="load('io')">IO Requests</button>
<div id="list"></div>
`;
}

}

async function login(){
const u=document.getElementById("u").value;
const p=document.getElementById("p").value;

const r=await api("/auth/login","POST",{username:u,password:p});
token=r.token;
me=r.user;
setUser();
view("internal");
}

function ban(){
content.innerHTML=`
<h2>Ban Request</h2>
<input id="a1" placeholder="Your Username + Rank">
<input id="a2" placeholder="Unit">
<input id="a3" placeholder="Position">
<hr>
<input id="s1" placeholder="Subject">
<input id="r" placeholder="Reason">
<input id="e" placeholder="Evidence">
<button class="primary" onclick="submitBan()">Submit</button>
`;
}

async function submitBan(){
await api("/ban","POST",{
agent:{u:a1.value,unit:a2.value,pos:a3.value},
suspect:{u:s1.value,reason:r.value,evidence:e.value}
});
alert("Sent");
}

function io(){
content.innerHTML=`
<h2>Inquiry Order</h2>
<input id="a1" placeholder="Your Username + Rank">
<input id="a2" placeholder="Unit">
<input id="a3" placeholder="Position">
<hr>
<input id="s1" placeholder="Subject">
<input id="r" placeholder="Reason">
<input id="e" placeholder="Evidence">
<input id="d" placeholder="Document Link">
<button class="primary" onclick="submitIO()">Submit</button>
`;
}

async function submitIO(){
await api("/io","POST",{
agent:{u:a1.value,unit:a2.value,pos:a3.value},
suspect:{u:s1.value,reason:r.value,evidence:e.value,doc:d.value}
});
alert("Sent");
}

async function load(type){
const r=await api("/pending/"+type);
list.innerHTML = r.items.map(i=>`
<div>
ID ${i.id} - ${i.suspect.u}
<button onclick="decision('${type}',${i.id},'approve')">Approve</button>
<button onclick="decision('${type}',${i.id},'deny')">Deny</button>
</div>
`).join("");
}

async function decision(type,id,dec){
await api("/decide","POST",{type,id,decision:dec});
load(type);
}
</script>

</body>
</html>
