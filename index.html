<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Army Corrections Command Portal</title>
<style>
:root{
  --bg0:#040b06; --bg1:#07140b;
  --line:rgba(249,199,22,.35); --line2:rgba(249,199,22,.18);
  --gold:#f9c716; --text:#eaf6ee; --muted:#bcd3c2;
  --greenGlow: rgba(59,123,52,.35);
}
*{ box-sizing:border-box; }
body{
  margin:0; color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:
    radial-gradient(900px 520px at 18% 10%, rgba(59,123,52,.22), transparent 60%),
    radial-gradient(900px 520px at 82% 0%, rgba(249,199,22,.10), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg0));
}
a{ color:var(--gold); text-decoration:none; }
.top{
  position:sticky; top:0; z-index:50;
  background: linear-gradient(180deg, rgba(10,28,16,.92), rgba(7,20,11,.92));
  border-bottom:1px solid var(--line2);
}
.wrap{ max-width:1160px; margin:0 auto; padding:14px 16px; }
.brand{ display:flex; gap:12px; align-items:center; }
.brand img{ width:44px; height:44px; object-fit:contain; filter: drop-shadow(0 0 10px rgba(59,123,52,.25)); }
.brand .t1{ font-weight:800; letter-spacing:.3px; font-size:15px; }
.brand .t2{ color:var(--muted); font-size:12px; margin-top:2px; }
.nav{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 12px;
  border-radius:14px; border:1px solid var(--line2);
  background: rgba(249,199,22,.06);
  color:var(--text); cursor:pointer; user-select:none;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
.btn:hover{ background: rgba(249,199,22,.10); }
.btn.primary{ border-color:var(--line); background: rgba(249,199,22,.12); color:var(--gold); }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.grid{ display:grid; grid-template-columns: 1.15fr .85fr; gap:14px; }
@media (max-width: 980px){ .grid{ grid-template-columns:1fr; } }
.card{
  background: linear-gradient(180deg, rgba(7,21,12,.92), rgba(4,11,6,.92));
  border:1px solid var(--line2);
  border-radius:18px;
  box-shadow: 0 18px 60px rgba(0,0,0,.45);
  overflow:hidden;
}
.card .hd{ padding:14px 14px 8px; border-bottom:1px solid var(--line2); display:flex; justify-content:space-between; align-items:center; gap:10px; }
.card .hd .h{ font-weight:800; letter-spacing:.2px; }
.card .bd{ padding:14px; }
.kicker{ color:var(--muted); font-size:12px; }
.hr{ height:1px; background:var(--line2); margin:12px 0; }
.in{
  width:100%; padding:10px 10px; border-radius:12px;
  border:1px solid var(--line2); background: rgba(255,255,255,.04);
  color:var(--text); outline:none;
}
.in:focus{ box-shadow:0 0 0 3px var(--greenGlow); border-color: var(--line); }
.lbl{ display:block; margin:10px 0 6px; color:var(--muted); }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > *{ flex:1; }
.small{ font-size:12px; color:var(--muted); }
.badge{
  display:inline-flex; align-items:center; padding:4px 10px;
  border-radius:999px; border:1px solid var(--line2);
  background: rgba(249,199,22,.06); color:var(--muted);
}
.newsItem{ padding:12px; border:1px solid var(--line2); border-radius:16px; background: rgba(4,11,6,.55); box-shadow: inset 0 0 0 1px rgba(59,123,52,.08); }
.newsItem + .newsItem{ margin-top:10px; }
.newsMeta{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:12px; margin-top:6px; }
.logLine{ padding:10px 12px; border-radius:14px; border:1px solid var(--line2); background: rgba(4,11,6,.55); }
.logLine + .logLine{ margin-top:8px; }
.hide{ display:none !important; }
.rte{
  min-height:180px; padding:10px; border-radius:14px;
  border:1px solid var(--line2); background: rgba(255,255,255,.03);
  outline:none;
}
.rte:focus{ box-shadow:0 0 0 3px var(--greenGlow); border-color: var(--line); }
.footer{ padding:20px 16px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="brand">
      <img src="USACIDC_SSI.PNG" alt="ACC"/>
      <div>
        <div class="t1">Army Corrections Command</div>
        <div class="t2"> <span style="color:var(--gold);font-weight:700">Duty. Honor. Justice.</span></div>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <span id="who" class="badge">Not logged in</span>
        <button id="logoutBtn" class="btn hide">Logout</button>
      </div>
    </div>

    <div class="nav">
      <button class="btn" data-view="about">About</button>
      <button class="btn" data-view="news">Home / News</button>
      <button class="btn" data-view="contact">Contact</button>
      <button class="btn" data-view="unit" id="unitBtn">Unit Tools</button>
      <button class="btn primary" data-view="login" id="loginNav">Login</button>
      <button class="btn hide" data-view="admin" id="adminNav">Admin</button>
      <button class="btn hide" data-view="logs" id="logsNav">Logs</button>
    </div>
  </div>
</div>

<div class="wrap" style="padding-top:16px;">
  <div class="grid">
    <div class="card">
      <div class="hd"><div>
        <div class="h" id="viewTitle">About</div>
        <div class="kicker" id="viewKicker">Relevant information regarding CID, JAGC and ACC as a whole.</div>
      </div></div>
      <div class="bd" id="viewBody"></div>
    </div>

    <div class="card">
      <div class="hd"><div class="h">Quick Actions</div></div>
      <div class="bd" id="sideBody"></div>
    </div>
  </div>
</div>

<div class="footer">© Army Corrections Command - MGEN VendettaPyrex</div>

<script>
const API_BASE = "the.chastiefola.workers.dev";

let TOKEN = localStorage.getItem("acc_token") || "";
let ME = null;

const $ = (id)=>document.getElementById(id);
const viewBody = $("viewBody");
const viewTitle = $("viewTitle");
const viewKicker = $("viewKicker");
const sideBody = $("sideBody");
const who = $("who");

function setWho(){
  if (!ME) { who.textContent = "Not logged in"; return; }
  who.textContent = `${ME.rank || "Member"} ${ME.username} • ${ME.unit}${ME.admin ? " • Admin" : ""}`;
}
function navSync(){
  $("logoutBtn").classList.toggle("hide", !TOKEN);
  $("loginNav").classList.toggle("hide", !!TOKEN);
  $("unitBtn").classList.toggle("hide", !TOKEN);
  $("adminNav").classList.toggle("hide", !(ME && ME.admin));
  $("logsNav").classList.toggle("hide", !(ME && ME.admin));
  setWho();
}

async function api(path, opts={}){
  const headers = opts.headers || {};
  headers["Content-Type"] = "application/json";
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function setView(name){
  document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("primary"));
  document.querySelector(`[data-view="${name}"]`)?.classList.add("primary");
  if (name === "about") return renderAbout();
  if (name === "contact") return renderContact();
  if (name === "news") return renderNews();
  if (name === "login") return renderLogin();
  if (name === "unit") return renderUnit();
  if (name === "admin") return renderAdmin();
  if (name === "logs") return renderLogs();
}

document.querySelectorAll("[data-view]").forEach(btn=>{
  btn.addEventListener("click", ()=> setView(btn.getAttribute("data-view")));
});
$("logoutBtn").addEventListener("click", ()=>{
  TOKEN=""; ME=null; localStorage.removeItem("acc_token");
  navSync();
  setView("about");
});

async function renderAbout(){
  viewTitle.textContent = "About";
  viewKicker.textContent = "Army Corrections Command overview.";
  sideBody.innerHTML = `
    <div class="small">If you are a member of CID or JAGC, please log in.</div>
    <div class="hr"></div>
    <button class="btn primary" onclick="setView('login')">Login</button>
  `;
  const data = await api("/pages/about", { method:"GET", headers:{} }).catch(()=>({ok:true, html:""}));
  viewBody.innerHTML = data.html?.trim()
    ? data.html
    : `<div class="newsItem"><b>Welcome.</b><div class="small" style="margin-top:6px;">This portal provides internal tools for Army Corrections Command subunits.</div></div>`;
}

async function renderContact(){
  viewTitle.textContent = "Contact";
  viewKicker.textContent = "Contact and links.";
  sideBody.innerHTML = `<div class="small">Admins can edit this page in the Admin panel.</div>`;
  const data = await api("/pages/contact", { method:"GET", headers:{} }).catch(()=>({ok:true, html:""}));
  viewBody.innerHTML = data.html?.trim()
    ? data.html
    : `<div class="newsItem"><b>Contact</b><div class="small" style="margin-top:6px;">Add your Discord/server contact information here.</div></div>`;
}

async function renderNews(){
  viewTitle.textContent = "Home / News";
  viewKicker.textContent = "Announcements posted by administrators.";
  sideBody.innerHTML = `
    <div class="small">News is visible to everyone.</div>
    ${ME && ME.admin ? `<div class="hr"></div><button class="btn primary" onclick="setView('admin')">Post News</button>` : ``}
  `;
  const data = await api("/news", { method:"GET", headers:{} });
  const items = data.items || [];
  viewBody.innerHTML = items.length ? items.map(renderNewsItem).join("") :
    `<div class="newsItem"><b>No posts yet.</b><div class="small" style="margin-top:6px;">Admins can post announcements from the Admin page.</div></div>`;
}

function renderNewsItem(it){
  const a = it.author || {};
  const who = `${a.rank ? a.rank + " " : ""}${a.username || "Admin"}${a.position ? " • " + a.position : ""}`;
  const dt = it.createdAt ? new Date(it.createdAt).toLocaleString() : "";
  return `
    <div class="newsItem">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
        <div>
          <div style="font-weight:800; font-size:15px; color:var(--gold)">${escapeHtml(it.title || "")}</div>
          <div class="newsMeta"><span>${escapeHtml(who)}</span><span>•</span><span>${escapeHtml(dt)}</span></div>
        </div>
        ${ME && ME.admin ? `<button class="btn" onclick="deleteNews('${it.id}')">Delete</button>` : ``}
      </div>
      <div class="hr"></div>
      <div>${it.html || ""}</div>
    </div>
  `;
}

async function deleteNews(id){
  if (!confirm("Delete this post?")) return;
  await api("/news/"+encodeURIComponent(id), { method:"DELETE" });
  await renderNews();
}

function renderLogin(){
  viewTitle.textContent = "Login";
  viewKicker.textContent = "Sign in to access unit tools.";
  sideBody.innerHTML = `<div class="small">Accounts are managed by administrators.</div>`;
  viewBody.innerHTML = `
    <label class="lbl">Username</label>
    <input class="in" id="lu" autocomplete="username" placeholder="Roblox username"/>
    <label class="lbl">Password</label>
    <input class="in" id="lp" type="password" autocomplete="current-password" placeholder="Password"/>
    <div class="row" style="margin-top:12px;">
      <button class="btn primary" onclick="doLogin()">Login</button>
      <button class="btn" onclick="setView('news')">View News</button>
    </div>
    <div class="small" id="loginMsg" style="margin-top:10px;"></div>
  `;
}

async function doLogin(){
  const u = $("lu").value.trim();
  const p = $("lp").value;
  $("loginMsg").textContent = "Signing in...";
  try{
    const data = await api("/auth/login", { method:"POST", body: JSON.stringify({ username:u, password:p }) });
    TOKEN = data.token;
    localStorage.setItem("acc_token", TOKEN);
    await loadMe();
    $("loginMsg").textContent = "Logged in.";
    setView("unit");
  }catch(e){
    $("loginMsg").textContent = "Unauthorized.";
  }
}

async function loadMe(){
  if (!TOKEN) { ME=null; navSync(); return; }
  try{
    const data = await api("/auth/me", { method:"GET" });
    ME = data.user;
  }catch{
    ME=null; TOKEN=""; localStorage.removeItem("acc_token");
  }
  navSync();
}

async function renderUnit(){
  if (!ME) return setView("login");
  viewTitle.textContent = "Unit Tools";
  viewKicker.textContent = `You are in ${ME.unit}. You can only access your unit's classified tools.`;
  sideBody.innerHTML = `
    <div class="small"><b>Lookup Background Status</b></div>
    <label class="lbl">Member Username</label>
    <input class="in" id="qUser" placeholder="Enter username"/>
    <button class="btn primary" style="margin-top:10px;" onclick="bgLookup()">Check</button>
    <div class="hr"></div>
    <div class="small">Admins can manage users, news, and pages.</div>
    ${ME.admin ? `<button class="btn" style="margin-top:10px;" onclick="setView('admin')">Admin Panel</button>` : ``}
  `;
  viewBody.innerHTML = `
    <div class="newsItem">
      <b>${ME.unit} Background Checks</b>
      <div class="small" style="margin-top:6px;">Search a member to view status. If you have edit permission, you can update statuses.</div>
    </div>
    <div id="bgBox" style="margin-top:10px;"></div>
  `;
}

async function bgLookup(){
  const username = $("qUser").value.trim();
  const box = $("bgBox");
  if (!username) return;
  box.innerHTML = `<div class="newsItem">Loading…</div>`;
  try{
    const data = await api(`/unit/background/get?unit=${encodeURIComponent(ME.unit)}&username=${encodeURIComponent(username)}`, { method:"GET" });
    const r = data.result;
    if (!r) { box.innerHTML = `<div class="newsItem"><b>Not found.</b></div>`; return; }
    box.innerHTML = (ME.unit === "JAGC") ? renderJagcBg(r, username) : renderCidBg(r, username);
  }catch(e){
    box.innerHTML = `<div class="newsItem"><b>Error.</b><div class="small">${escapeHtml(e.message||"")}</div></div>`;
  }
}

function renderJagcBg(r, username){
  return `
    <div class="newsItem">
      <b>${escapeHtml(username)}</b>
      <div class="newsMeta"><span>Discord: ${escapeHtml(r.discordUsername||"")}</span><span>•</span><span>ID: ${escapeHtml(r.discordId||"")}</span></div>
      <div class="hr"></div>
      <div class="row">
        <div>
          <div class="small">Stage 1</div>
          <input class="in" id="j_s1" value="${escapeAttr(r.stage1||"")}" />
        </div>
        <div>
          <div class="small">Stage 2</div>
          <input class="in" id="j_s2" value="${escapeAttr(r.stage2||"")}" />
        </div>
      </div>
      <label class="lbl">Result</label>
      <input class="in" id="j_res" value="${escapeAttr(r.result||"")}" />
      <div class="row" style="margin-top:12px;">
        <button class="btn primary" onclick="bgUpdateJAGC('${escapeAttr(username)}')">Update</button>
      </div>
    </div>
  `;
}

function renderCidBg(r, username){
  return `
    <div class="newsItem">
      <b>${escapeHtml(username)}</b>
      <div class="newsMeta"><span>Entrance: ${escapeHtml(r.entranceMethod||"")}</span><span>•</span><span>Performed: ${escapeHtml(r.performedBy||"")} ${escapeHtml(r.performedOn||"")}</span></div>
      <div class="hr"></div>
      <label class="lbl">Notes</label>
      <textarea class="in" id="c_notes" rows="3">${escapeHtml(r.notes||"")}</textarea>
      <div class="row" style="margin-top:10px;">
        <div>
          <div class="small">Overall Status</div>
          <input class="in" id="c_overall" value="${escapeAttr(r.overall||"")}" placeholder="Failed / Passed / Pending / On Hold"/>
        </div>
        <div>
          <div class="small">Enhanced Security</div>
          <input class="in" id="c_enh" value="${escapeAttr(r.enhanced||"")}" placeholder="Failed / Passed / Pending / On Hold"/>
        </div>
      </div>
      <label class="lbl">Background Check</label>
      <input class="in" id="c_bg" value="${escapeAttr(r.background||"")}" placeholder="Failed / Passed / Pending / On Hold"/>
      <div class="row" style="margin-top:12px;">
        <button class="btn primary" onclick="bgUpdateCID('${escapeAttr(username)}')">Update</button>
      </div>
      <div class="small" style="margin-top:10px;">Approval can only be set by PurelyGeon (server-side enforced).</div>
    </div>
  `;
}

async function bgUpdateJAGC(username){
  const stage1 = $("j_s1").value.trim();
  const stage2 = $("j_s2").value.trim();
  const result = $("j_res").value.trim();
  await api("/unit/background/update", { method:"POST", body: JSON.stringify({ unit:"JAGC", username, stage1, stage2, result }) });
  await bgLookup();
}

async function bgUpdateCID(username){
  const notes = $("c_notes").value;
  const overall = $("c_overall").value.trim();
  const enhanced = $("c_enh").value.trim();
  const background = $("c_bg").value.trim();
  await api("/unit/background/update", { method:"POST", body: JSON.stringify({ unit:"CID", username, notes, overall, enhanced, background }) });
  await bgLookup();
}

async function renderAdmin(){
  if (!ME || !ME.admin) return setView("news");
  viewTitle.textContent = "Admin Panel";
  viewKicker.textContent = "Manage pages, news, and users (VendettaPyrex only).";
  sideBody.innerHTML = `<div class="small"><b>Admin shortcuts</b></div>
    <button class="btn" style="margin-top:10px;" onclick="setView('logs')">Open Logs</button>
    <button class="btn" style="margin-top:10px;" onclick="setView('news')">View News</button>`;
  viewBody.innerHTML = `
    <div class="newsItem">
      <b>Post News</b>
      <label class="lbl">Title</label>
      <input class="in" id="n_title" placeholder="Announcement title"/>
      <label class="lbl">Content</label>
      <div class="rte" id="n_html" contenteditable="true"></div>
      <div class="row" style="margin-top:12px;">
        <button class="btn primary" onclick="postNews()">Post</button>
      </div>
    </div>

    <div class="hr"></div>

    <div class="newsItem">
      <b>Edit Pages</b>
      <div class="row" style="margin-top:10px;">
        <button class="btn" onclick="loadPageEditor('about')">Edit About</button>
        <button class="btn" onclick="loadPageEditor('contact')">Edit Contact</button>
      </div>
      <div id="pageEditor" style="margin-top:10px;"></div>
    </div>

    <div class="hr"></div>

    <div class="newsItem">
      <b>Users</b>
      <div class="small" style="margin-top:6px;">Add/remove users. Choose unit (CID/JAGC) and rank.</div>
      <div class="row" style="margin-top:10px;">
        <div>
          <label class="lbl">Username</label>
          <input class="in" id="u_name" placeholder="Roblox username"/>
        </div>
        <div>
          <label class="lbl">Password</label>
          <input class="in" id="u_pass" placeholder="Set password"/>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div>
          <label class="lbl">Unit</label>
          <select class="in" id="u_unit">
            <option value="CID">Army Corrections Command (CID)</option>
            <option value="JAGC">JAGC</option>
          </select>
        </div>
        <div>
          <label class="lbl">Rank</label>
          <select class="in" id="u_rank">${armyRanksOptions()}</select>
        </div>
      </div>
      <label class="lbl">Position</label>
      <input class="in" id="u_pos" placeholder="e.g., Investigator / Legal Officer"/>
      <div class="row" style="margin-top:12px;">
        <button class="btn primary" onclick="userAdd()">Add / Update</button>
        <button class="btn" onclick="userRemove()">Remove</button>
        <button class="btn" onclick="userRefresh()">Refresh List</button>
      </div>
      <div id="usersList" style="margin-top:12px;"></div>
    </div>
  `;
  await userRefresh();
}

async function postNews(){
  const title = $("n_title").value.trim();
  const html = $("n_html").innerHTML.trim();
  await api("/news", { method:"POST", body: JSON.stringify({ title, html }) });
  $("n_title").value=""; $("n_html").innerHTML="";
  alert("Posted.");
}

async function loadPageEditor(name){
  const data = await api("/pages/"+name, { method:"GET" });
  $("pageEditor").innerHTML = `
    <div class="small"><b>Editing ${escapeHtml(name)}</b></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" onclick="savePage('${name}')">Save</button>
      <button class="btn" onclick="previewPage()">Preview</button>
    </div>
    <label class="lbl">HTML Content</label>
    <div class="rte" id="p_html" contenteditable="true"></div>
    <div class="hr"></div>
    <div class="small"><b>Preview</b></div>
    <div class="newsItem" id="p_prev" style="margin-top:8px;"></div>
  `;
  $("p_html").innerHTML = data.html || "";
  $("p_prev").innerHTML = data.html || "";
}
async function savePage(name){
  const html = $("p_html").innerHTML;
  await api("/pages/set", { method:"POST", body: JSON.stringify({ name, html }) });
  alert("Saved.");
}
function previewPage(){
  $("p_prev").innerHTML = $("p_html").innerHTML;
}

async function userAdd(){
  const username = $("u_name").value.trim();
  const password = $("u_pass").value;
  const unit = $("u_unit").value;
  const rank = $("u_rank").value;
  const position = $("u_pos").value.trim();
  await api("/users/add", { method:"POST", body: JSON.stringify({ username, password, unit, rank, position, admin: username==="VendettaPyrex" }) });
  await userRefresh();
}
async function userRemove(){
  const username = $("u_name").value.trim();
  if (!username) return;
  if (!confirm("Remove "+username+"?")) return;
  await api("/users/remove", { method:"POST", body: JSON.stringify({ username }) });
  await userRefresh();
}
async function userRefresh(){
  const data = await api("/users/list", { method:"GET" });
  const rows = data.users || [];
  $("usersList").innerHTML = rows.length ? rows.map(u=>`
    <div class="logLine">
      <div><b>${escapeHtml(u.rank||"Member")} ${escapeHtml(u.username)}</b> • ${escapeHtml(u.unit||"")}${u.admin?" • Admin":""}</div>
      <div class="small">${escapeHtml(u.position||"")}</div>
    </div>
  `).join("") : `<div class="small">No users.</div>`;
}

async function renderLogs(){
  if (!ME || !ME.admin) return setView("news");
  viewTitle.textContent = "Logs";
  viewKicker.textContent = "Audit log of actions.";
  sideBody.innerHTML = `<div class="small">Format: “Rank Username performed action”.</div>`;
  const data = await api("/logs?limit=100", { method:"GET" });
  const items = data.items || [];
  viewBody.innerHTML = items.length ? items.map(x=>`
    <div class="logLine">
      <div style="color:var(--gold); font-weight:800">${escapeHtml(x.line || "")}</div>
      <div class="small">${escapeHtml(new Date(x.ts).toLocaleString())}</div>
    </div>
  `).join("") : `<div class="newsItem"><b>No logs yet.</b></div>`;
}

function escapeHtml(str){
  return (str ?? "").toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }
